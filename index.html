<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход в систему</title>
  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.18);
      --card-border: rgba(255, 255, 255, 0.3);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.78);
      --input-bg: rgba(255, 255, 255, 0.95);
      --button-start: #7c4dff;
      --button-end: #5e35b1;
      --focus: rgba(124, 77, 255, 0.4);
      --shadow: 0 18px 40px rgba(17, 12, 36, 0.35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Inter", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 35%, #7f00ff 100%);
      color: var(--text);
      padding: 16px;
    }

    .login-card {
      width: min(420px, 100%);
      backdrop-filter: blur(14px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(22px, 4vw, 34px);
    }

    .login-card h1 {
      font-size: clamp(1.4rem, 2.2vw, 1.8rem);
      margin-bottom: 8px;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .login-card p {
      color: var(--muted);
      text-align: center;
      margin-bottom: 22px;
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.98rem;
      background: var(--input-bg);
      color: #131313;
      outline: none;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .field input:focus {
      box-shadow: 0 0 0 4px var(--focus);
      transform: translateY(-1px);
    }

    .actions {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    .actions button {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.98rem;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      background: linear-gradient(90deg, var(--button-start), var(--button-end));
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .actions button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .actions button:active {
      transform: translateY(0);
      filter: brightness(0.98);
    }

    .actions a {
      color: var(--muted);
      text-align: center;
      font-size: 0.88rem;
      text-decoration: none;
    }

    .actions a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-card {
        border-radius: 14px;
      }

      .field input,
      .actions button {
        padding: 11px 12px;
      }
    }
  </style>
</head>
<body>
  <main class="login-card" aria-label="Форма входа">
    <h1>Добро пожаловать</h1>
    <p>Войдите, чтобы продолжить</p>

    <form>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required />
      </div>

      <div class="actions">
        <button type="submit">Войти</button>
        <a href="#">Забыли пароль?</a>
      </div>
    </form>
  </main>
</body>
</html>
